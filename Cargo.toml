[package]
name = "tis"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
num-integer = "=0.1.46"
compact_str = "=0.10.0"
ruff_python_parser = "=0.0.14"
ruff_python_ast = "=0.0.14"
serde = "1.0"
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision"] }
jiter = { version = "=0.17.0", default-features = false }
stacker = "=0.1.25"
cranelift-codegen = "=0.137.0"
cranelift-frontend = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-jit = "=0.137.0"
memmap2 = "=0.9.12"
wasmtime-internal-jit-icache-coherence = "=50.0.0"

[build-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["read", "std"] }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ref-count-return"))'] }

# Stabilize optimization of runtime callbacks when stencil/planner code changes.
[profile.release.package.tis]
codegen-units = 1
