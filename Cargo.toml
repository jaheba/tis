[package]
name = "tis"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ruff_python_parser = "=0.0.14"
ruff_python_ast = "=0.0.14"
serde = "1.0"
stacker = "=0.1.25"
cranelift-codegen = "=0.137.0"
cranelift-frontend = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-jit = "=0.137.0"
memmap2 = "=0.9.12"
wasmtime-internal-jit-icache-coherence = "=50.0.0"

[build-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["read", "std"] }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ref-count-return"))'] }
